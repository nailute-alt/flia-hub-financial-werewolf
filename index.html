--><title>金融狼人杀 FLIA-werewolf v1.2</title>
<style>
  /* ===================== 全局 / 像素风基础 ===================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #1a0f08;   /* 实色底，避免透明棋盘格 */
    font-family: 'Zpix', 'Microsoft YaHei', 'PingFang SC', 'Heiti SC', monospace;
    color: #2C1810;
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* 游戏画布：固定比例 1100x690，按视口自适应缩放 */
  #game-root {
    position: relative;
    width: min(100vw, 1100px);
    aspect-ratio: 1100 / 690;
    background: #0d0d0d;   /* 实色画布底，避免透明棋盘格 */
    overflow: hidden;
    box-shadow: 0 0 0 4px #5a3a1a, 0 0 30px rgba(0,0,0,0.6);
    user-select: none;
  }

  /* ===================== 场景背景（白天 / 夜晚） ===================== */
  #scene {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: filter 0.6s ease;
    z-index: 1;
  }
  /* 夜晚蓝色压暗叠层 */
  #scene.night::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(20,20,70,0.55), rgba(10,10,40,0.65));
    z-index: 2;
  }

  /* ===================== 顶部 HUD：轮次 / 阶段 / 语言 ===================== */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 8.7%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.2%;
    background: rgba(44,24,16,0.78);
    color: #F4EAD0; z-index: 30;
    border-bottom: 3px solid #5a3a1a;
    font-size: clamp(11px, 1.7vw, 18px);
  }
  #topbar .round-info { font-weight: bold; letter-spacing: 1px; }
  #topbar .phase-info { color: #ffd27a; }
  .pixel-btn {
    font-family: inherit;
    background: #F4EAD0; color: #2C1810;
    border: 3px solid #5a3a1a; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font-weight: bold;
    box-shadow: 0 3px 0 #5a3a1a;
  }
  .pixel-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a3a1a; }

  /* ===================== 状态栏：8 个财务值 ===================== */
  #statusbar {
    position: absolute; top: 8.7%; left: 0; right: 0; height: 9.5%;

  }
  .stat-cell {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    color: #F4EAD0; font-size: 12px; line-height: 1.2;
    overflow: hidden;
  }
  .stat-top { display: flex; align-items: center; gap: 3px; min-width: 0; }
  .stat-icon { flex: 0 0 auto; width: 16px; height: 16px; font-size: 14px; line-height: 16px; text-align: center; }
  .stat-name { font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  /* v0.8.1：英文标签略缩字号，避免 8 格状态下 Fin-Lit / Survive 等贴边 */
  :root:lang(en) .stat-name { font-size: 11px; }
  .stat-val { font-weight: bold; font-size: 12px; text-align: right; flex: 0 0 auto; color: #ffd27a; }
  .stat-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .stat-bar > i { display: block; height: 100%; background: #2e8b57; transition: width 0.3s ease; }

  /* 浮动数字动画（红涨绿跌，遵循金融惯例） */
  .float-num {
    position: absolute; transform: translateX(-50%);
    font-weight: bold; font-size: clamp(11px,1.7vw,18px);
    pointer-events: none; z-index: 31; white-space: nowrap;

  }
  .float-num.up   { color: #e63946; } /* 增加 = 红（金融涨色） */
  .float-num.down { color: #2e8b57; } /* 减少 = 绿（金融跌色） */
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 6px); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -22px); }
  }

  /* ===================== v1.0 中央舞台：桌游围桌布局（替代 v0.8.1 3×3 网格） ===================== */
  :root { --log-width: 260px; }
  #game-table {
    position: absolute; left: 0; right: var(--log-width);

  }
  .seat-no {

  .seat-name {

  .seat.dead .seat-avatar { filter: grayscale(100%); opacity: 0.58; border-color: #999; }

  .seat.selectable { cursor: pointer; box-shadow: 0 0 0 2px #ffd27a; }
  .seat.selectable:hover { transform: translate(-50%, calc(-50% - 3px)); box-shadow: 0 0 0 2px #ff9d2e, 0 4px 0 #5a3a1a; }

  .seat.player.dead,
  .seat.player-seat.dead { box-shadow: 0 0 0 2px #b9985a, 0 3px 0 #5a3a1a; }
  .seat.host-seat {

    box-shadow: 0 0 0 2px #4d8ccf, 0 3px 0 #2f5f92;

  .seat .seat-you,
  .seat .seat-host {

  /* ===================== 对话框（参考主体游戏：缩放进概念 / 18字每行 / 自动换行） ===================== */

// B(zh,en)：构造双语文本对象
function B(zh,en){ return { zh, en }; }
// txtB：按当前语言取双语对象文本；字符串原样返回（并替换金融数值占位符）
function txtB(b){ if(!b) return ''; if(typeof b==='string') return substVars(b); return substVars(LANG==='en' ? (b.en||'') : (b.zh||'')); }
// tB：按 key 取双语对象（跳过当前语言解析，保证两个语言都正确）
function tB(key){ const z=(I18N.zh&&I18N.zh[key]!==undefined)?I18N.zh[key]:key; const e=(I18N.en&&I18N.en[key]!==undefined)?I18N.en[key]:key; return { zh:z, en:e }; }
// 规整任意输入为双语对象
function normB(v){ if(v==null) return {zh:'',en:''}; if(typeof v==='object' && (('zh' in v)||('en' in v))) return {zh:v.zh||'', en:v.en||''}; return {zh:v, en:v}; }
// v0.8 P1-4：金融数值动态化——对话/历史文本中的 {coins}/{savings}/{liability}/{credit} 等占位符，
// 按当前 G.playerStatus 实时替换（money 格式化钱币类），杜绝主持人/台词硬编码数值。
function substVars(s){
  if(typeof s !== 'string') return s;
  if(!G || !G.playerStatus) return s;
  return s.replace(/\{\s*(\w+)\s*\}/g, function(m, k){
    if(Object.prototype.hasOwnProperty.call(G.playerStatus, k)){
      const v = G.playerStatus[k];
      if(k==='coins' || k==='savings' || k==='liability') return money(v);
      return '' + Math.round(v);
    }
    return m; // 未知占位符保留原样
  });
}

/* ---------- 0.6b v0.5.3 双语历史记录 ----------
 * 每条历史消息存储 {name:{zh,en}, text:{zh,en}, cls, bold}，切换语言时整面板重渲染，杜绝中英混合。 */
function historyAppend(entry){
  if(!G) return;                       // 游戏未开始时不记录
  if(!G.history) G.history = [];
  G.history.push(entry);
  renderHistoryLine(entry, true);
}
// 重渲染单条（appendOnly=true 表示仅追加最新一条，避免整面板重排）
function renderHistoryLine(e, appendOnly){
  const h=document.getElementById('log'); if(!h) return;
  const el=document.createElement('div');
  if(e.raw !== undefined){
    el.className='h-line'+(e.cls?(' '+e.cls):''); el.innerHTML=e.raw;
  } else {
    const nm = e.name ? txtB(e.name) : '';
    const tx = e.text ? txtB(e.text) : '';
    el.className='h-line'+(e.cls?(' '+e.cls):'');
    el.innerHTML = (nm ? '<span class="h-name">'+escapeHtml(nm)+'：</span>' : '') + (e.bold ? '<b>'+escapeHtml(tx)+'</b>' : escapeHtml(tx));
  }
  if(appendOnly){ h.appendChild(el); if(historyAtBottom) h.scrollTop = h.scrollHeight; }
  else h.appendChild(el);
}
// 整面板重渲染（语言切换时调用）
function renderHistory(){
  const h=document.getElementById('log'); if(!h) return;
  h.innerHTML='';
  if(!G || !G.history) return;
  G.history.forEach(e=> renderHistoryLine(e, false));
  if(historyAtBottom) h.scrollTop = h.scrollHeight;
}
// 事件日志（双语）：text 为 {zh,en} 对象或字符串；opts={cls,bold}
function logB(textB, opts){
  opts = opts || {};
  const text = (typeof textB==='string') ? { zh:textB, en:textB } : normB(textB);
  historyAppend({ text, cls:opts.cls, bold:opts.bold });
}

/* ---------- 0.7 撤销栈（P0-4，仅覆盖 选择 / 投票 / PK 决策） ---------- */
let undoStack = [];
function cloneSafe(v){ try { return structuredClone(v); } catch(e){ return JSON.parse(JSON.stringify(v)); } }
function sanitizeState(g){
  const keys=['seats','round','maxRound','phase','playerId','playerDead','playerStatus','nightKillId','nightSavedId','nightPoisonId','voteOutId','knownWolves','lastSeerCheck','witchAntidote','witchPoison','result','pkTied','flags','marks','reportCount','playerVoteWeight','dominoChainActive','roundData','dialogQueue'];
  const o={}; keys.forEach(k=>{ if(g[k]!==undefined) o[k]=cloneSafe(g[k]); }); return o;
}
function pushUndo(reenter){
  undoStack.push({ snap: sanitizeState(G), reenter });
  const ub=document.getElementById('btn-undo'); if(ub) ub.disabled=false;
}
function restoreUndo(){
  if(undoStack.length===0) return null;
  const e=undoStack.pop();
  Object.keys(e.snap).forEach(k=>{ if(e.snap[k]!==undefined) G[k]=e.snap[k]; });
  const ub=document.getElementById('btn-undo'); if(ub) ub.disabled=(undoStack.length===0);
  return e.reenter;
}
function undoMove(){
  if(undoStack.length===0){
    const ub=document.getElementById('btn-undo');
    if(ub){ ub.classList.remove('flash'); void ub.offsetWidth; ub.classList.add('flash'); }
    return;
  }
  const reenter=restoreUndo();
  // 清空当前对话框与提示，回到决策界面
  G.dialogQueue=[]; G.pendingAfterDialog=null; G._curDialogItem=null;
  document.getElementById('d-text').textContent=''; document.getElementById('d-name').textContent='　';
  markSpeaking(null);
  renderTopbar(); renderStatusbar(); renderStage();
  if(!reenter) return;
  if(reenter.type==='choice') presentChoice(reenter.choices, reenter.opts, true);
  else if(reenter.type==='vote') enterVote(true);
  else if(reenter.type==='pk') enterPK(reenter.tiedIds, true);
}

/* ---------- 4. 工具函数 ---------- */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function aliveSeats(){ return G.seats.filter(s=>s.alive); }
function seatById(id){ return G.seats.find(s=>s.char.id===id); }
function asset(path){ return ASSET_BASE + path; }

// 工具：获取预言家已确认的狼人编号（全部 / 仅存活）——P2 可用于 UI 高亮提示
function knownWolfIds(){ return G ? G.knownWolves.slice() : []; }
function aliveKnownWolfIds(){ return G ? G.knownWolves.filter(id=>{ const s=seatById(id); return s && s.alive; }) : []; }

// 图片加载失败兜底：替换为占位底色，保证布局不崩
function imgFallback(imgEl){
  imgEl.onerror = function(){ imgEl.style.background = '#d8c39a'; imgEl.removeAttribute('src'); };
}

// 击杀一名席位，并触发猎人开枪连锁（猎人仅 NPC，玩家固定为村民）。
// 返回受影响名单（含猎人开枪的受害者），供天亮/结算播报使用。
function killSeat(id, cause){
  const affected = [];
  const s = seatById(id);
  if(!s || !s.alive) return affected;
  s.alive = false;
  if(s.isPlayer){ G.playerDead = true; G.playerDeathCause = cause; }   // v0.6：记录玩家出局原因（猎人被毒死不可开枪）
  affected.push({ id: id, cause: cause });
  // 猎人死亡 → 开枪带走一人。NPC 猎人自动开枪；玩家猎人由调用方在死亡结算后
  // 通过 showHunterGun() 弹出开枪 UI 处理（G.hunterGunUsed 防止重复触发）。
  // v0.6：被女巫毒死（cause==='poison'）的猎人不可开枪（与 role_info 设定一致）。
  if(s.type === 'hunter' && cause !== 'poison'){
    if(!s.isPlayer){
      const shotId = hunterChooseTarget(s);
      if(shotId != null){
        const t = seatById(shotId);
        if(t && t.alive){ t.alive = false; if(t.isPlayer){ G.playerDead = true; G.playerDeathCause = 'hunter'; } affected.push({ id: shotId, cause: 'hunter' }); }
      }
    }
  }
  return affected;
}
// 猎人开枪选靶
function hunterChooseTarget(hunterSeat){
  const alive = aliveSeats();
  const known = alive.filter(x=> G.knownWolves.includes(x.char.id));
  let target;
  if(known.length>0 && Math.random() < BAL.hunterAcc) target = pick(known);
  else { const cands = alive.filter(x=>x.char.id!==hunterSeat.char.id); target = cands.length ? pick(cands) : null; }
  return target ? target.char.id : null;
}

/* ---------- 5. 身份随机分配（3 狼 / 3 神 / 3 民） ----------
 * v0.5.3 P0-1：玩家（固定 7 号陈小明）身份随机化。
 * 全部 9 个席位打乱后前 3 → 狼、中 3 → 神、后 3 → 民，玩家可能是任意角色，
 * 每次重开重新随机，严格保持 3 / 3 / 3 比例。 */
function assignRoles(){
  // v1.1：玩家座位与身份随机独立——先随机座位上的人物，再独立随机身份卡
  const seatChars = shuffle(CHARACTERS.slice());
  const seats = seatChars.map(c => ({
    char: c, alive: true, isPlayer: (c.id === G.playerId), faction: 'villager', type: null
  }));
  // 打乱全部 9 个席位的下标，按比例切片分配（玩家包含在内）
  const order = shuffle([0,1,2,3,4,5,6,7,8]);
  order.forEach((idx, i)=>{
    const s = seats[idx];
    if(i < 3){ s.faction = 'wolf'; s.type = WOLF_TYPES[i]; }                 // 0,1,2 → 3 狼
    else if(i < 6){ s.faction = 'god'; s.type = GOD_TYPES[i-3]; }           // 3,4,5 → 3 神
    else { s.faction = 'villager'; s.type = 'villager'; }                   // 6,7,8 → 3 民
  });
  G.seats = seats;
}

/* ---------- 5.5 状态变更统一入口 + 浮动动画 ---------- */
// 所有状态变更必须走本函数，确保 8 显示键 + 隐藏键 liability 一致处理，
// 并触发 +N/-N 浮动动画（仅 8 个显示键参与动画；liability 为隐藏判定键，不显示）。
function changeStatus(key, delta, reason){
  if(delta === 0) return;
  const cur = (G.playerStatus[key] === undefined) ? 0 : G.playerStatus[key];
  let nv = cur + delta;
  if(key === 'coins'){
    // v0.5：金币允许为负，破产条件 coins<0 && liability>5000 依赖此语义；
    // liability 由剧本 effects 显式累加，不再自动从 coins 负值转入。
  } else if(key === 'savings'){
    if(nv < 0) nv = 0;                       // 储蓄不为负
  } else if(key === 'liability'){
    if(nv < 0) nv = 0;
  } else {
    if(nv < 0) nv = 0; if(nv > 100) nv = 100; // 百分比类键钳制 0–100
  }
  G.playerStatus[key] = nv;
  renderStatusbar();
  floatStatus(key, delta);
}

// 浮动数字动画：在某状态格上方飘出 +N / -N（红涨绿跌，遵循金融惯例）
function floatStatus(key, delta){
  if(delta === 0) return;
  const cell = G._cells[key];
  const bar = document.getElementById('statusbar');
  if(!cell || !bar) return;
  const f = document.createElement('div');
  f.className = 'float-num ' + (delta > 0 ? 'up' : 'down');
  f.textContent = (delta > 0 ? '+' : '') + Math.round(delta);
  f.style.left = (cell.offsetLeft + cell.offsetWidth / 2) + 'px';
  f.style.top  = (cell.offsetTop + 4) + 'px';
  bar.appendChild(f);
  setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 1100);
}

/* ---------- 6. 渲染：状态栏 ---------- */
function renderStatusbar(){
  const bar = document.getElementById('statusbar');
  bar.innerHTML = '';
  G._cells = {}; // 重建单元格引用（浮动动画定位用）
  STATUS_KEYS.forEach(k=>{
    const val = G.playerStatus[k.key];
    const label = (LANG==='en') ? k.en : k.zh;
    const tip = k.zh + ' / ' + k.en; // 双语 tooltip：鼠标悬停显示 中文 / English 状态名
    const isMoney = (k.key==='coins' || k.key==='savings');
    const max = k.max || 100;
    const pct = Math.max(0, Math.min(100, (val / max) * 100));
    const cell = document.createElement('div');
    cell.className = 'stat-cell';
    cell.setAttribute('data-key', k.key);
    cell.title = tip;               // 原生悬停 tooltip
    G._cells[k.key] = cell;
    cell.innerHTML = `<div class="stat-top">
        <span class="stat-icon">${k.icon}</span>
        <span class="stat-name">${label}</span>
        <span class="stat-val">${isMoney ? money(val) : Math.round(val)}</span>
      </div>
      <div class="stat-bar"><i style="width:${pct}%"></i></div>`;
    bar.appendChild(cell);
  });
}

function seatPointByIndex(idx){
  const pts = [
    ['54%','17%'],  // 1 上左

    ['78%','17%'],  // 3 上右

    ['54%','100%'], // 8 下左
    ['66%','100%'], // 9 下中

  ];
  return pts[idx] || ['50%','50%'];
}
function buildHostSeat(){
  return {
    isHost: true,
    isPlayer: false,
    alive: true,
    faction: 'host',
    type: 'host',
    char: { id: 0, portrait: 'portrait_host.png' }
  };
}
function buildTableSeats(){
  const seat9 = (G && Array.isArray(G.seats)) ? G.seats.slice() : [];
  const table = seat9.slice();
  table.splice(1, 0, buildHostSeat()); // 固定上排中间法官位
  return table;
}
function seatDomBaseClass(s, selectable){
  if(s && s.isHost) return 'seat host-seat';
  return 'seat'
    + (s.alive ? '' : ' dead')
    + (s.isPlayer ? ' player player-seat' : '')
    + (selectable && s.alive && !s.isPlayer ? ' selectable' : '');
}
function applySeatVisualMarks(div, s, playerIsWolf){
  if(s.isHost){
    const hostTag = document.createElement('div'); hostTag.className='seat-host';
    hostTag.textContent = (LANG==='en' ? 'HOST' : '法官');
    div.appendChild(hostTag);
    return;
  }
  if(s.isPlayer){
    const tag = document.createElement('div'); tag.className='seat-you';
    tag.textContent = (LANG==='en' ? 'YOU' : '你');
    div.appendChild(tag);
  }
  if(playerIsWolf && s.faction==='wolf' && !s.isPlayer){
    div.classList.add('wolf-partner');
    const badge = document.createElement('div'); badge.className='wolf-badge';
    if(!s.alive){ div.classList.add('wolf-partner-out'); badge.textContent = (LANG==='en' ? 'OUT' : '已出局'); }
    else { badge.textContent = '🐺'; }
    div.appendChild(badge);
  }
}
function renderStage(selectable=false, onPick=null){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const playerSeat = G.seats.find(s=>s.isPlayer);
  const playerIsWolf = !!(playerSeat && playerSeat.faction==='wolf');
  const tableSeats = buildTableSeats();
  let seatNum = 0;
  tableSeats.forEach((s, idx)=>{
    const div = document.createElement('div');
    div.className = seatDomBaseClass(s, selectable);
    div.setAttribute('data-id', s.char.id);
    if(s.isHost) div.setAttribute('data-seat', 'host');
    else { seatNum += 1; div.setAttribute('data-seat', String(seatNum)); }
    const pos = seatPointByIndex(idx);
    div.style.left = pos[0];
    div.style.top = pos[1];

    const img = document.createElement('img');
    img.className = 'seat-avatar avatar';
    img.src = s.isHost ? asset('characters/portrait_host.png') : asset('characters/' + s.char.portrait);
    imgFallback(img);
    div.appendChild(img);

    const no = document.createElement('div');
    no.className='seat-no';
    no.textContent = s.isHost ? (LANG==='en' ? 'Host' : '法官') : (s.char.id + (LANG==='en'?'':'号'));
    const nm = document.createElement('div');
    nm.className='seat-name';
    nm.textContent = s.isHost ? (LANG==='en' ? 'Host Sprite' : '主持人小精灵') : npcName(s.char.id);
    div.appendChild(no); div.appendChild(nm);

    if(!s.isHost){
      const tg = document.createElement('div'); tg.className='seat-tag'; tg.textContent = npcTag(s.char.id);
      div.appendChild(tg);
    }

    applySeatVisualMarks(div, s, playerIsWolf);

    if(!s.isHost && selectable && s.alive && !s.isPlayer){
      const handler = onPick || G._onPick;
      if(handler) div.onclick = ()=> handler(s.char.id);
    }
    stage.appendChild(div);
  });
}

/* ---------- 10. 对话框播放器（顺序台词 + 点击继续） ---------- */
function say(speakerId, text, name){
  // text / name 可为 {zh,en} 双语对象或字符串；规整后存入队列，保证历史可双语重渲染
  G.dialogQueue.push({ speakerId, text: normB(text), name: normB(name) });
}
function playDialogQueue(after){
  G.pendingAfterDialog = after;
  advanceDialog();
}
function advanceDialog(){
  if(G.dialogQueue.length === 0){
    const cb = G.pendingAfterDialog; G.pendingAfterDialog = null; G._curDialogItem = null;
    if(cb) cb();
    return;
  }
  const item = G.dialogQueue.shift();
  G._curDialogItem = item;
  renderDialogItem(item);
}
// 渲染一条对话框内容（语言切换时重渲染当前句）；历史按双语存储
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderDialogItem(item, skipHistory){
  const nameEl = document.getElementById('d-name');
  const textEl = document.getElementById('d-text');
  const portEl = document.getElementById('d-portrait');
  const imgEl = document.getElementById('d-pimg');
  let nameB = { zh:'', en:'' };   // 双语姓名
  if(item.speakerId == null){
    // 主持人 / 旁白 → 真实头像（P1-1，失败回退 mic）
    nameEl.textContent = t('narrator');
    setHostPortrait(imgEl);
    portEl.style.background = '#FFF8E7';
    nameB = tB('hostName');
    markSpeaking(null);
  } else {
    const s = seatById(item.speakerId);
    if(s){
      const nb = npcNameB(s.char.id);
      nameB = { zh:(s.char.id+'号 '+nb.zh), en:(s.char.id+' '+nb.en) };
      nameEl.textContent = txtB(nameB);
      imgEl.src = asset('characters/'+s.char.full);   // P1-3：全身像
      portEl.style.background = '#FFF8E7';
      markSpeaking(s.char.id);
    } else {
      // 非 1-9 号（历史曾出现的非名单发言者 / 或其他异常发言者）兜底分支：
      // 用剧本自带 name，头像回退 GUEST_SPEAKERS 或 SVG_PERSON 人像占位，杜绝 undefined / 空白头像。
      // 当前 B3 game_data/rounds_data.js 已重同步为 A2 清理版，数据层无残留，本分支正常不触发。
      nameB = normB(item.name);
      nameEl.textContent = txtB(nameB) || t('narrator');
      const g = GUEST_SPEAKERS[item.speakerId];
      imgEl.src = g ? g.icon : SVG_PERSON;
      portEl.style.background = '#FFF8E7';
      markSpeaking(null);
    }
  }
  textEl.textContent = txtB(item.text);
  textEl.scrollTop = 0;
  // 历史记录：双语存储每句对话（P0-2）；语言切换重渲染时跳过以免重复
  if(!skipHistory) historyAppend({ name: nameB, text: normB(item.text) });
  updateNextLabel();
}

/* ---------- 12.1 一轮的开始：夜晚 → 白天讨论 → 投票 → 结算 ---------- */
function beginRound(){
  logB(B('—— 第 '+G.round+' 轮 ——', '— Round '+G.round+' —'));
  G.phase = 'NIGHT';
  G.playerVoteWeight = 1; // v1.0：兼容字段每轮归一，计票始终按 1 票处理
  renderTopbar();

  renderStage();

  say(null, B(`第 ${G.round} 轮：夜幕降临，狼人正在秘密选择今晚的目标……`, `Round ${G.round}: Night falls. The wolves are choosing their prey...`));
  playDialogQueue(()=> nightAction());

/* ---------- 12.2 夜晚行动：狼人击杀 → 预言家查验 → 女巫用药 → 天亮 announce ----------
 * v0.5.3 P0-1 / P2：玩家持有狼 / 预言家 / 女巫身份时，对应夜间行动交由玩家交互决策；
 * 其余 NPC 仍自动结算。猎人无夜间行动，但出局时可开枪（见 showHunterGun）。 */
function nightAction(){
  const alive = aliveSeats();
  const wolves = alive.filter(s=>s.faction==='wolf');
  const preyAll = alive.filter(s=>s.faction!=='wolf'); // 狼可刀任何非狼
  const playerSeat = G.seats.find(s=>s.isPlayer);
  const playerIsWolf  = playerSeat.alive && playerSeat.faction==='wolf';
  const playerIsSeer  = playerSeat.alive && playerSeat.faction==='god' && playerSeat.type==='seer';
  const playerIsWitch = playerSeat.alive && playerSeat.faction==='god' && playerSeat.type==='witch';

  G.nightKillId = null;
  // 狼人击杀：玩家为狼 → 交由玩家决策（presentWolfAction）；否则自动（含首夜按兵不动）
  if(wolves.length>0 && !playerIsWolf){
    if(G.round === 1){
      G.nightKillId = null; // 首夜狼人按兵不动（平衡：放缓早期减员，确保 5-6 轮可达）
    } else {
      const markedNow = G.marks.some(m=> m.round===G.round);
      const priorityNow = G.flags.priorityKill;
      let target = null;
      if(playerSeat.alive && (markedNow || priorityNow) && Math.random() < 0.7) target = playerSeat;
      // 防御：若已无非狼存活者（好边被屠尽），则无可击杀目标，nightKillId 保持 null（P0 边界）
      G.nightKillId = (target ? target.char.id : (preyAll.length ? pick(preyAll).char.id : null));
    }
  }
  // 预言家查验：玩家为预言家 → 交由玩家决策；否则自动（存活>2 守卫）
  const seer = alive.find(s=>s.faction==='god' && s.type==='seer');
  if(seer && !seer.isPlayer && alive.length>2){
    const others = alive.filter(s=>s.char.id!==seer.char.id);
    const wlf = others.filter(s=>s.faction==='wolf');
    const tgt = (wlf.length>0 && Math.random() < BAL.seerWolfBias) ? pick(wlf) : pick(others);
    G.lastSeerCheck = { seerId: seer.char.id, targetId: tgt.char.id, isWolf: tgt.faction==='wolf' };
  } else if(!(seer && seer.isPlayer)){
    G.lastSeerCheck = null;
  }
  // 女巫：玩家为女巫 → 交由玩家决策；否则自动
  G.nightSavedId = null; G.nightPoisonId = null;
  const witch = alive.find(s=>s.faction==='god' && s.type==='witch');
  if(witch && !witch.isPlayer){
    if(G.witchAntidote && G.nightKillId && Math.random() < BAL.witchSave){
      G.nightSavedId = G.nightKillId; G.witchAntidote = false; // 救下狼刀目标
    }
    if(G.witchPoison && Math.random() < BAL.witchPoison){
      const cands = alive.filter(s=>s.char.id!==G.nightSavedId);
      if(cands.length>0){ G.nightPoisonId = pick(cands).char.id; G.witchPoison = false; }
    }
  }

  // 汇总玩家夜间行动（若玩家持有对应身份），否则直接结算天亮
  const finishNight = ()=> resolveNightDeaths();
  if(playerIsWolf)        presentWolfAction(finishNight);
  else if(playerIsSeer)   presentSeerAction(finishNight);
  else if(playerIsWitch)  presentWitchAction(finishNight);
  else finishNight();
}

/* ---------- 12.2b v0.5.3 玩家夜间行动 UI（复用 #choice-panel） ---------- */
function panelHide(){ const p=document.getElementById('choice-panel'); if(p) p.classList.remove('show'); G._nightRebuild = null; G._nightButtons = null; }
// 渲染夜间行动面板；titleB/descB 为 {zh,en} 或字符串；infoB 为顶部信息框（如狼人同伴，红色狼头）
function renderNightPanel(titleB, descB, buttons, infoB){
  const panel = document.getElementById('choice-panel');
  panel.classList.add('show'); panel.innerHTML = '';
  const t = document.createElement('div'); t.className='cp-title'; t.textContent = txtB(titleB); panel.appendChild(t);
  const info = txtB(infoB);
  if(info){ const ib=document.createElement('div'); ib.className='cp-info'; ib.textContent=info; panel.appendChild(ib); }
  const d = txtB(descB);
  if(d){ const dd=document.createElement('div'); dd.className='cp-desc'; dd.textContent=d; panel.appendChild(dd); }
  buttons.forEach(b=>{
    const btn=document.createElement('button'); btn.className='choice-opt'+(b.selected?' selected':'');
    btn.innerHTML = b.html || escapeHtml(b.label);
    btn.onclick = b.onclick;
    panel.appendChild(btn);
  });
  G._nightButtons = buttons; // 暴露给自动化测试驱动
}
// 狼人行动：显示同伴信息（Bug1）+ 选择击杀目标（非狼存活者，排除同伴）；首夜按兵不动
function presentWolfAction(done){
  const wolves = G.seats.filter(s=>s.faction==='wolf');
  const partners = wolves.filter(s=>!s.isPlayer);
  let infoZh, infoEn;
  if(partners.length===0){
    infoZh = '🐺 你是最后的狼人，请谨慎行动';
    infoEn = '🐺 You are the last wolf — act with caution';
  } else {
    const zl = partners.map(s=> seatLabel(s.char.id)+' '+npcNameB(s.char.id).zh + (s.alive ? '' : '（已出局）'));
    const el = partners.map(s=> s.char.id+' '+npcNameB(s.char.id).en + (s.alive ? '' : ' (out)'));
    infoZh = '🐺 你的狼人同伴：'+zl.join('、');
    infoEn = '🐺 Your werewolf partners: '+el.join(', ');
  }
  const alive = aliveSeats();
  const prey = alive.filter(s=>s.faction!=='wolf');
  const rebuild = ()=>{
    let buttons;
    if(prey.length===0){
      const hold = (LANG==='en') ? "Don't kill — end the night" : '不杀人，结束夜晚';
      buttons = [{ label: hold, onclick: ()=>{ G.nightKillId = null; panelHide(); done(); } }];
    } else {
      // v0.8 P0-3：每轮夜晚都提供击杀目标（排除同伴+已出局），并显式提供「不杀人」选项
      buttons = prey.map(s=>({
        label: seatLabel(s.char.id)+' '+npcName(s.char.id),
        onclick: ()=>{ G.nightKillId = s.char.id; panelHide(); done(); }
      }));
      buttons.push({
        label: (LANG==='en' ? "Don't kill — end the night" : '不杀人，结束夜晚'),
        onclick: ()=>{ G.nightKillId = null; panelHide(); done(); }
      });
    }
    renderNightPanel(t('nightWolfTitle'), t('nightWolfDesc'), buttons, { zh:infoZh, en:infoEn });
  };
  G._nightRebuild = rebuild; rebuild();
}
// 预言家行动：查验一名玩家（非自己）
function presentSeerAction(done){
  const alive = aliveSeats();
  const cands = alive.filter(s=>!s.isPlayer);
  if(cands.length===0){ done(); return; }
  const rebuild = ()=>{
    const buttons = cands.map(s=>({
      label: seatLabel(s.char.id)+' '+npcName(s.char.id),
      onclick: ()=>{
        const isWolf = s.faction==='wolf';
        G.lastSeerCheck = { seerId: G.playerId, targetId: s.char.id, isWolf };
        if(isWolf && !G.knownWolves.includes(s.char.id)) G.knownWolves.push(s.char.id);
        const nb = npcNameB(s.char.id);
        const slZh = s.char.id+'号', slEn = ''+s.char.id;
        const resZh = isWolf ? '的查验结果是：狼人！' : '的查验结果是：好人（神民 / 村民）';
        const resEn = isWolf ? ': a WOLF!' : ': a good player (god / villager)';
        logB(B(`你查验了 ${slZh} ${nb.zh}${resZh}`, `You checked ${slEn} ${nb.en}${resEn}`), { cls:'h-event' });
        const rTitle = isWolf ? B('你查验到一只狼人！','You found a WOLF!') : B('你查验到一位好人。','You found a good player.');

      }
    }));
    renderNightPanel(t('nightSeerTitle'), t('nightSeerDesc'), buttons);
  };

}
// v0.7.1 女巫行动（P0 重写）：严格夜晚顺序 —— 狼人先刀人(nightAction 已记录 nightKillId)
//   → 告知今夜被杀者 → 解药(独立,仅 witchAntidote) → 毒药(独立,仅 witchPoison) → 结算。
// 关键修复：①「不使用解药/毒药」绝不把对应 used 标记置 true（只有真正使用才置 true）；
//          ② 只要还有药未用，女巫阶段每轮都必须进入（不会因上一轮「不使用」而永久跳过）；
//          ③ 狼人必须先完成击杀，女巫才能看到死亡信息；④ 女巫自己被杀不能自救但可下毒；
//          ⑤ 解药与毒药均已用完 → 显示「你的药已用完」并直接跳过。
function presentWitchAction(done){
  G._witchPhaseTrace = [];                 // 自测用：记录本夜女巫流程阶段序列（announce/antidote/poison/skip）
  G._witchConsulted  = (G._witchConsulted||0) + 1;
  const alive = aliveSeats();
  const killedId = (G.nightKillId && G.nightKillId !== G.nightSavedId) ? G.nightKillId : null;
  const killed = killedId ? seatById(killedId) : null;

  // 药已用完：解药与毒药都已用 → 直接跳过，提示「你的药已用完」（不再进入任何选择）
  if(!G.witchAntidote && !G.witchPoison){
    G._witchPhaseTrace.push('skip');
    const zh = '你的药已用完，今晚无法再行动。', en = 'Your potions are used up — nothing more to do tonight.';
    const buttons = [{ label: (LANG==='en' ? 'End the night' : '结束夜晚'), onclick: ()=>{ panelHide(); done(); } }];
    renderNightPanel(B('🧪 女巫 · 夜晚', '🧪 Witch · Night'), B(zh, en), buttons);
    G._nightRebuild = ()=> renderNightPanel(B('🧪 女巫 · 夜晚', '🧪 Witch · Night'), B(zh, en), buttons);
    return;
  }

  // 步骤 A：告知女巫今夜谁被狼人击杀（狼人已在 nightAction 完成击杀并写入 nightKillId）
  function stepAnnounce(next){
    G._witchPhaseTrace.push('announce');
    if(!killed){
      const zh = '今晚平安，无人被狼人击杀。', en = "It's a peaceful night — no one was killed by the wolves.";
      logB(B(zh, en), { cls:'h-event' });
      const buttons = [{ label: (LANG==='en' ? 'Continue' : '继续'), onclick: ()=>{ panelHide(); next(); } }];
      renderNightPanel(t('nightWitchTitle'), B(zh, en), buttons);
      G._nightRebuild = ()=> renderNightPanel(t('nightWitchTitle'), B(zh, en), buttons);
    } else {
      const nb = npcNameB(killed.char.id);
      const slZh = killed.char.id+'号', slEn = ''+killed.char.id;
      const zh = killed.isPlayer ? '你今晚被狼人击杀了。' : `今晚 ${slZh} ${nb.zh} 被狼人击杀。`;
      const en = killed.isPlayer ? 'You were killed by the wolves tonight.' : `Tonight ${slEn} ${nb.en} was killed by the wolves.`;
      logB(B(zh, en), { cls:'h-event' });
      const buttons = [{ label: (LANG==='en' ? 'Continue' : '继续'), onclick: ()=>{ panelHide(); next(); } }];
      renderNightPanel(t('nightWitchTitle'), B(zh, en), buttons);
      G._nightRebuild = ()=> renderNightPanel(t('nightWitchTitle'), B(zh, en), buttons);
    }
  }

  // 步骤 B：解药（仅 witchAntidote===true；且 有被杀者 且 被杀者非自己）
  function stepAntidote(next){
    if(!G.witchAntidote){ next(); return; }          // 解药已用：跳过（绝不消耗毒药）
    if(!killed){ next(); return; }                    // 无人被杀：无药可救，跳过
    if(killed.isPlayer){                              // 自己被杀：不能自救，跳过并提示
      G._witchPhaseTrace.push('antidote-skip-self');
      logB(B('你无法使用解药救自己', 'You cannot use the antidote to save yourself'), { cls:'h-event' });
      next(); return;
    }
    G._witchPhaseTrace.push('antidote');
    const nb = npcNameB(killed.char.id);
    const slZh = killed.char.id+'号', slEn = ''+killed.char.id;
    const titleZh = '🧪 女巫行动 · 解药', titleEn = '🧪 Witch Action · Antidote';
    const descZh = `是否使用解药救下 ${slZh} ${nb.zh}？`;
    const descEn = `Use the antidote to save ${slEn} ${nb.en}?`;
    const rebuild = ()=>{
      const buttons = [
        { label: (LANG==='en' ? 'Use Antidote (save '+slEn+' '+nb.en+')' : '使用解药救'+slZh+' '+nb.zh),
          onclick: ()=>{ G.nightSavedId = killed.char.id; G.witchAntidote = false;   // 真正使用才置 true
            logB(B(`你用解药救下了 ${slZh} ${nb.zh}`, `You saved ${slEn} ${nb.en}`), { cls:'h-event' });
            panelHide(); next(); } },
        { label: (LANG==='en' ? "Don't use antidote" : '不使用解药'),
          onclick: ()=>{ /* 不使用：绝不消耗解药，保留以便后续轮次使用 */ panelHide(); next(); } }
      ];
      renderNightPanel(B(titleZh,titleEn), B(descZh,descEn), buttons);
    };
    G._nightRebuild = rebuild; rebuild();
  }

  // 步骤 C：毒药（仅 witchPoison===true；可毒任意存活玩家，含狼人；女巫自己被杀也可下毒）
  function stepPoison(){
    if(!G.witchPoison){ done(); return; }             // 毒药已用：结束
    G._witchPhaseTrace.push('poison');
    const poisonCands = alive.filter(s=> s.char.id !== G.nightSavedId);
    const titleZh = '🧪 女巫行动 · 毒药', titleEn = '🧪 Witch Action · Poison';
    const descZh = '是否使用毒药？可毒杀任意存活玩家（各限一次）。';
    const descEn = 'Use the poison? You may poison any alive player (one use only).';
    const rebuild = ()=>{
      const buttons = [
        { label: (LANG==='en' ? 'Use Poison' : '使用毒药'),
          onclick: ()=>{
            const sub = poisonCands.map(s=>({
              label: seatLabel(s.char.id)+' '+npcName(s.char.id),
              onclick: ()=>{ G.nightPoisonId = s.char.id; G.witchPoison = false;   // 真正使用才置 true
                const nb=npcNameB(s.char.id), slZh=s.char.id+'号', slEn=''+s.char.id;
                logB(B(`你用毒药毒杀了 ${slZh} ${nb.zh}`, `You poisoned ${slEn} ${nb.en}`), { cls:'h-event' });
                panelHide(); done(); } }));
            const subTitle = B('🧪 女巫行动 · 选择毒杀目标', '🧪 Witch Action · Choose poison target');
            renderNightPanel(subTitle, '', sub);
            G._nightRebuild = ()=> renderNightPanel(subTitle, '', sub);
          } },
        { label: (LANG==='en' ? "Don't use poison — end the night" : '不使用毒药，结束夜晚'),
          onclick: ()=>{ /* 不使用：绝不消耗毒药，保留以便后续轮次使用 */ panelHide(); done(); } }
      ];
      renderNightPanel(B(titleZh,titleEn), B(descZh,descEn), buttons);
    };
    G._nightRebuild = rebuild; rebuild();
  }

  // 主线：狼人已刀人（nightAction 完成）→ 告知 → 解药 → 毒药 → 结算
  stepAnnounce(()=> stepAntidote(()=> stepPoison()));
}
// 猎人开枪（玩家出局时）：带走一名存活玩家（含狼人），或放弃
function showHunterGun(done){
  const alive = aliveSeats();
  const cands = alive.filter(s=>!s.isPlayer);
  if(cands.length===0){ G.hunterGunUsed = true; done(); return; }
  const rebuild = ()=>{
    const buttons = cands.map(s=>({
      label: seatLabel(s.char.id)+' '+npcName(s.char.id),
      onclick: ()=>{
        const t2 = seatById(s.char.id);
        if(t2 && t2.alive){ t2.alive=false; if(t2.isPlayer){ G.playerDead=true; G.playerDeathCause='hunter'; }
          const nb=npcNameB(s.char.id), slZh=s.char.id+'号', slEn=''+s.char.id;
          logB(B(`你开枪带走了 ${slZh} ${nb.zh}`, `You shot ${slEn} ${nb.en}`), { cls:'h-event' }); }
        panelHide(); G.hunterGunUsed = true; done();
      }
    }));
    buttons.push({ label: t('hunterGunSkip'), onclick: ()=>{ panelHide(); G.hunterGunUsed = true; done(); } });
    renderNightPanel(t('hunterGunTitle'), t('hunterGunDesc'), buttons);
  };
  G._nightRebuild = rebuild; rebuild();
}
// 天亮：结算死亡（狼刀 + 女巫毒），含猎人开枪连锁，随后播报并进入白天剧本
function resolveNightDeaths(){
  const beforeAlive = aliveSeats().map(s=>s.char.id);
  const deaths = [];
  if(G.nightKillId && G.nightKillId!==G.nightSavedId) deaths.push({ id: G.nightKillId, cause: 'wolf' });
  if(G.nightPoisonId) deaths.push({ id: G.nightPoisonId, cause: 'poison' });
  let affected = [];
  deaths.forEach(d=>{ affected = affected.concat(killSeat(d.id, d.cause)); });
  const nowDead = beforeAlive.filter(id=>{ const s=seatById(id); return s && !s.alive; });

  G.phase = 'DAY'; renderTopbar(); setScene('DAY'); renderStage();
  G.dialogQueue = [];
  if(nowDead.length===0){
    // v0.8 P1-6：明确平安夜原因，杜绝「连续平安夜」歧义
    if(G.nightKillId && G.nightSavedId && G.nightSavedId===G.nightKillId){
      const v = seatById(G.nightKillId); const nb = v ? npcNameB(v.char.id) : {zh:'',en:''};
      const slZh = G.nightKillId+'号', slEn = ''+G.nightKillId;
      say(null, B(`天亮了，${slZh} ${nb.zh} 被狼人击杀但被女巫救下，昨夜无人遇害。`,
                   `Dawn breaks. No.${slEn} ${nb.en} was killed by the wolves but saved by the Witch — no one died last night.`));
    } else {
      say(null, B('天亮了，狼人没有选择击杀目标，昨夜无人遇害。',
                   'Dawn breaks. The wolves chose not to kill — no one died last night.'));
    }
  } else {
    nowDead.forEach(id=>{
      const v = seatById(id);
      const how = B('在夜晚被狼人带走', 'taken by the wolves');
      if(G.nightSavedId===id){ how.zh='被女巫救下'; how.en='saved by the Witch'; }        // 不会出现在 nowDead
      else if(G.nightPoisonId===id){ how.zh='被女巫毒杀'; how.en='poisoned by the Witch'; }
      else if(affected.some(a=>a.id===id && a.cause==='hunter')){ how.zh='被猎人开枪带走'; how.en='shot by the Hunter'; }
      const nb = npcNameB(v.char.id);
      const slZh = v.char.id+'号', slEn = ''+v.char.id;
      say(null, B(`天亮了，${slZh} ${nb.zh} 被发现——${how.zh}。`, `At dawn, ${slEn} ${nb.en} is found — ${how.en}.`));
      logB(B(`${slZh} ${nb.zh} ${how.zh}`, `${slEn} ${nb.en} ${how.en}`), { cls:'h-event' });
    });
  }
  // 玩家猎人若在夜晚出局 → 开枪 UI（打断，回调后进入白天剧本）。
  // v0.6：统一入口 maybePlayerHunterShot 含「非猎人/已开枪/被毒死」守卫，杜绝重复触发。
  maybePlayerHunterShot(()=> playDialogQueue(()=>{ presentRound(); }));
}
// v0.6：玩家猎人出局开枪统一入口（防重复触发）。
// 仅当「玩家已出局 且 是猎人 且 未被女巫毒死 且 尚未开过枪」才弹出开枪 UI；否则直接 done()。
// 非猎人玩家 / 已开过枪 / 被毒死 一律不触发。
function maybePlayerHunterShot(done){
  const p = G.seats.find(s=>s.isPlayer);
  if(p && !p.alive && p.type==='hunter' && !G.hunterGunUsed && G.playerDeathCause!=='poison'){
    showHunterGun(()=>{ G.hunterGunUsed = true; done(); });
  } else {
    done();
  }
}
// 投票/平票出局后：若玩家（猎人）被投出且符合开枪条件，弹出开枪 UI 并接管结算；否则返回 false 走正常结算
function proceedAfterElimination(){
  const p = G.seats.find(s=>s.isPlayer);
  if(p && !p.alive && p.type==='hunter' && !G.hunterGunUsed && G.playerDeathCause!=='poison'){
    showHunterGun(()=>{ G.hunterGunUsed = true; settle(); });
    return true;
  }
  return false;
}

// v0.6：胜负判定（标准狼人规则 + 屠边）——每轮白天投票结算后立即调用。
// 返回：'GOOD'（狼人全灭 → 好人阵营胜利）/ 'WOLF'（神职全灭 或 普通村民全灭 → 狼人阵营胜利·屠边）
//       / 'END'（场上仅剩 ≤1 人，强制结束；存活者阵营即胜方）/ null（未分胜负，继续下一轮）。
function checkWinCondition(){
  const al = aliveSeats();
  if(al.length <= 1){
    if(al.length === 0) return 'WOLF';                 // 防御：理论上不会发生
    return (al[0].faction === 'wolf') ? 'WOLF' : 'GOOD';
  }
  const aw = al.filter(s=>s.faction==='wolf').length;
  const ag = al.filter(s=>s.faction==='god').length;
  const av = al.filter(s=>s.faction==='villager').length;
  if(aw === 0) return 'GOOD';        // 狼人全部出局 → 好人阵营胜利
  if(ag === 0 || av === 0) return 'WOLF';   // 神职全部出局 或 普通村民全部出局 → 狼人阵营胜利（屠边）
  return null;                       // 未分胜负
}

/* ---------- 12.3 白天·剧本流程（A2 真实数据） ---------- */
function presentRound(){
  G.phase = 'DAY';
  renderTopbar();
  if(typeof roundsData === 'undefined' || !roundsData || !roundsData[G.round-1]){ enterVote(); return; }
  const rd = roundsData[G.round-1];   // 6 轮，索引 0-5
  G.roundData = rd;
  G.dialogQueue = [];
  // 场景旁白（双语）
  say(null, B(`第 ${G.round} 轮·${rd.title.zh}（${rd.theme.zh}）`, `Round ${G.round}·${rd.title.en} (${rd.theme.en})`));
  say(null, B(rd.scene.zh, rd.scene.en));
  // 剧本化台词（roundsData.dialogues，含 1-9 号 NPC；数据已重同步为 A2 清理版，R1 发言者为 9 号周健，无客串）
  rd.dialogues.forEach(d=>{
    say(d.speaker, d.text, d.name);
  });
  // 每个存活 NPC 追加一句 day[round] 全状态台词（A2 数据）
  aliveSeats().filter(s=>!s.isPlayer).forEach(s=>{
    const npc = NPC_BY_ID[s.char.id];
    if(npc && npc.lines && npc.lines.day && npc.lines.day[G.round]){
      const arr = npc.lines.day[G.round];
      const line = arr[0]; // 取第一句作为当日发言
      if(line) say(s.char.id, line);
    }
  });
  // v0.8 P0-2：主持人不再剧透身份——预言家查验结果仅夜晚私密告知预言家玩家（玩家预言家在夜间已看到）；
  // NPC 预言家若存活，由其**本人发言跳身份**（非主持人公告）；主持人绝不说出任何存活玩家身份/结果。
  if(G.lastSeerCheck){
    const sc = G.lastSeerCheck;
    const seer = seatById(sc.seerId), tgt = seatById(sc.targetId);
    const resZh = sc.isWolf ? '狼人' : '好人';
    const resEn = sc.isWolf ? 'a WOLF' : 'a good citizen';
    const nbTgt = npcNameB(tgt.char.id);
    const slSeerZh = seer.char.id+'号', slSeerEn = ''+seer.char.id;
    const slTgtZh = tgt.char.id+'号', slTgtEn = ''+tgt.char.id;
    // 内部线索仍保留给镇民 AI（维持阵营平衡），但绝不通过主持人公开披露
    if(sc.isWolf && !G.knownWolves.includes(sc.targetId)) G.knownWolves.push(sc.targetId);
    // NPC 预言家跳身份：由其本人发言（非主持人公告）；玩家预言家已私密知晓，不强制公开
    if(seer && seer.alive && !seer.isPlayer){
      say(sc.seerId, B(`我是预言家！昨晚我查验了 ${slTgtZh} ${nbTgt.zh}，他的身份是${resZh}！`,
                       `I am the Seer! Last night I checked ${slTgtEn} ${nbTgt.en} — ${resEn}!`));
    }
  }
  playDialogQueue(()=> presentChoice(rd.choices, { round: rd, isMain:true, onDone: ()=> presentSubEvents(rd, 0) }));
}

function checkSubEventCondition(se){
  if(!se || !se.condition) return true;
  const c = se.condition;
  const st = G && G.playerStatus ? G.playerStatus : {};
  const trigger = c.trigger || '';
  if(trigger === 'markedDeep'){
    const stFlag = Number(st.markedDeep||0) === 1;
    const markFlag = Array.isArray(G.marks) && G.marks.some(m=>m && m.deep);
    return stFlag || markFlag;
  }
  if(typeof c.key === 'string'){
    if(typeof c.eq !== 'undefined') return st[c.key] === c.eq;
    if(typeof c.gte !== 'undefined') return Number(st[c.key]||0) >= Number(c.gte);
    if(typeof c.lte !== 'undefined') return Number(st[c.key]||0) <= Number(c.lte);
  }
  return true;
}
// 依次播放当前轮的支线子事件，结束后进入投票
function presentSubEvents(rd, idx){
  if(idx >= rd.subEvents.length){ enterVote(); return; }
  const se = rd.subEvents[idx];
  if(!checkSubEventCondition(se)){
    logB(B(`条件未满足，已跳过支线：${se.title.zh}`, `Condition unmet, skipped side event: ${se.title.en}`), { cls:'h-event' });
    presentSubEvents(rd, idx+1);
    return;
  }
  G.dialogQueue = [];
  say(null, B(`支线·${se.title.zh}`, `Side·${se.title.en}`));
  say(null, B(se.scene.zh, se.scene.en));
  (se.dialogues||[]).forEach(d=> say(d.speaker, d.text, d.name));
  playDialogQueue(()=> presentChoice(se.choices, { round: rd, sub: se, onDone: ()=> presentSubEvents(rd, idx+1) }));
}

/* ---------- 12.3b 选择题 UI（单选 / 多选 / 自动结算） ---------- */
function presentChoice(choices, opts, skipUndo){
  opts = opts || {};
  // v0.8 P0-1：玩家已出局 → 进入观察者模式，不做金融选择题、不修改 8 键状态栏（冻结），直接推进流程
  if(G.playerDead){
    logB(B('你已出局，作为旁观者观战', 'You are out — spectating as an observer'), { cls:'h-event' });
    if(opts && opts.onDone) opts.onDone();
    return;
  }
  if(!skipUndo) pushUndo({ type:'choice', choices, opts });
  const round = opts.round, sub = opts.sub;
  const multi = !!(round && round.multiSelect);     // 仅第5轮主题为 true
  const auto  = !!(sub && sub.autoCalc);            // 第6-2 自动结算
  // 结果叙事取自选项所属对象（主线轮 / 支线）的 consequences 映射，而非单选项自身
  const conseqMap = sub ? sub.consequences : (round ? round.consequences : null);
  if(auto){ presentAutoCalc(sub, opts.onDone); return; }
  G.phase = 'DAY'; renderTopbar();
  const panel = document.getElementById('choice-panel');
  panel.classList.add('show'); panel.innerHTML = '';
  const title = document.createElement('div'); title.className='cp-title';
  title.textContent = multi ? t('multiChoiceTitle') : t('choiceTitle');
  panel.appendChild(title);
  const desc = document.createElement('div'); desc.className='cp-desc';
  desc.textContent = (sub ? TXT(sub.title.zh, sub.title.en) : TXT(`${round.title.zh}：${round.theme.zh}`, `${round.title.en}: ${round.theme.en}`));
  panel.appendChild(desc);
  G._curChoices = choices;
  G._lastChoiceCall = { choices, opts };
  G._lastResult = null;

  if(multi){
    const selected = {};
    const btns = choices.map(c=>{
      const b = document.createElement('button'); b.className='choice-opt';
      b.innerHTML = `${c.id}. ${TXT(c.text.zh, c.text.en)}` + (c.knowledge?`<span class="opt-knowledge">💡 ${t('linkedKnowledge')}</span>`:'');
      b.onclick = ()=>{ selected[c.id] = !selected[c.id]; b.classList.toggle('selected', selected[c.id]); };
      panel.appendChild(b); return b;
    });
    const submit = document.createElement('button'); submit.className='cp-submit'; submit.textContent = t('submitBtn');
    submit.onclick = ()=>{
      const picked = Object.keys(selected).filter(k=>selected[k]);
      let correct=0; choices.forEach(c=>{ const isPicked = picked.includes(c.id); if(c.isScam===isPicked) correct++; });
      const n = choices.length;
      let tier = round.scoring.correct01;
      if(correct===n) tier = round.scoring.allCorrect;
      else if(correct>=Math.min(n,4)) tier = round.scoring.correct45;
      else if(correct>=2) tier = round.scoring.correct23;
      else tier = round.scoring.correct01;
      changeStatus('literacy', tier.literacy);
      panel.classList.remove('show');
      showChoiceResult(()=>{
        const lines = choices.map(c=> `${c.id}. ${TXT(conseqMap[c.id].zh, conseqMap[c.id].en)}`).join('<br>');
        const head = TXT(`你正确识别了 ${correct}/${n} 条。`, `You correctly spotted ${correct}/${n}.`) + (tier.label? `<br><b>${TXT(tier.label.zh, tier.label.en)}</b>`:'');
        return head + '<br>' + lines;
      }, opts.onDone);
    };
    panel.appendChild(submit);
    G._choice = { submit: ()=>submit.onclick(), pick:(id)=>{ if(!selected[id]){ selected[id]=true; const i=choices.findIndex(c=>c.id===id); if(i>=0) btns[i].classList.add('selected'); } } };
    return;
  }

  // 单选题
  const handlers = {};
  choices.forEach(c=>{
    const b = document.createElement('button'); b.className='choice-opt';
    b.innerHTML = `${c.id}. ${TXT(c.text.zh, c.text.en)}` + (c.knowledge?`<span class="opt-knowledge">💡 ${t('linkedKnowledge')}</span>`:'');
    b.onclick = handlers[c.id] = ()=>{
      panel.classList.remove('show');
      applyChoiceEffects(c, opts);
      const conseq = (conseqMap && conseqMap[c.id]) ? conseqMap[c.id] : null;
      showChoiceResult(()=> conseq ? TXT(conseq.zh, conseq.en) : '', opts.onDone);
    };
    panel.appendChild(b);
  });
  G._choice = { pick:(id)=>{ if(handlers[id]) handlers[id](); } };
}

// 应用选项 effects + 捕获标记键 + 知识点卡片
function applyChoiceEffects(c, opts){
  applyEffects(c.effects);
  const f = G.flags;
  if(c.collude) f.collude = true;
  if(c.justiceEnding) f.justice = true;
  if(c.dominoRisk){ f.dominoRisk = true; G.dominoChainActive = true;
    // 多米诺连锁：担保触发 → 你被扣¥2,000、信用受损（关联 NPC 收入减半的叙事落点）
    changeStatus('coins', -2000); changeStatus('credit', -10);
  }
  if(c.moralHazard) f.moralHazard = true;
  if(c.priorityKill) f.priorityKill = true;
  if(c.isGroupVote) G.playerVoteWeight = 1;   // v1.0：isGroupVote 仅作剧情/标记语义，不改变票权
  if(c.markedBy){ G.marks.push({ by:c.markedBy, round:(c.markedRound||(G.round+1)), deep:!!c.markedDeep }); }
  if(c.markedDeep && !c.markedBy){ G.marks.push({ by:0, round:G.round+1, deep:true }); }
  // 举报/揭穿计数（知识点为 k_whistleblowing 且非 C 私下谈判）
  if(c.knowledge==='k_whistleblowing' && c.id!=='C'){ f.exposed = true; G.reportCount++; }
  if(opts && opts.round && opts.round.round===6 && c.id==='D'){ f.stayedSafe = true; }
  if(c.knowledge) showKnowledgeCard(c.knowledge);
}

// 应用 9 键 effects（含隐藏 liability），忽略 riskNote / note 等非状态键
function applyEffects(eff){
  if(!eff) return;
  ['coins','savings','energy','credit','social','academics','literacy','survival','liability'].forEach(k=>{
    const v = eff[k];
    if(typeof v === 'number' && v !== 0) changeStatus(k, v);
  });
}

// 知识点卡片弹窗（双语，可关闭，非阻塞）。Bug3：从「请求卡所属主题」的子池中随机抽取，
// 按本局 Fisher-Yates 洗牌顺序取首个未用卡——每局序列不同、防玩家背答案；主题一致保证内容相关。
function showKnowledgeCard(key){
  const pool = (typeof knowledgeCards !== 'undefined') ? Object.keys(knowledgeCards) : [];
  const theme = KTHEME[key];
  let cand = pool.filter(k=> theme && KTHEME[k]===theme && !(G.kUsed && G.kUsed[theme] && G.kUsed[theme].indexOf(k) >= 0));
  if(cand.length === 0){ if(G.kUsed) G.kUsed[theme] = []; cand = pool.filter(k=> theme && KTHEME[k]===theme); }
  const ordered = ((G.kShuffle && G.kShuffle.length) ? G.kShuffle : pool.slice()).filter(k=> cand.indexOf(k) >= 0);
  const pickKey = ordered.length ? ordered[0] : (cand.length ? cand[0] : key);
  if(G.kUsed && theme) (G.kUsed[theme] = G.kUsed[theme] || []).push(pickKey);
  const card = (typeof knowledgeCards !== 'undefined') ? knowledgeCards[pickKey] : null;
  const panel = document.getElementById('knowledge-panel');
  if(!card){ panel.classList.remove('show'); return; }
  panel.innerHTML = '';
  const box = document.createElement('div'); box.className='k-card';
  const theory = card.related_theory || { zh:'', en:'' };
  box.innerHTML = `<h2>${TXT(card.title.zh, card.title.en)}</h2>
    <div class="k-content">${TXT(card.content.zh, card.content.en)}</div>
    <div class="k-theory"><b>${t('knowledgeTitle')}：</b>${TXT(theory.zh, theory.en)}</div>`;
  const close = document.createElement('button'); close.className='k-close';
  close.textContent = t('knowledgeClose');
  close.onclick = ()=> panel.classList.remove('show');
  box.appendChild(close);
  panel.appendChild(box);
  panel.classList.add('show');
  G._knowledgeKey = pickKey;   // 记录实际展示的卡（语言切换重渲染用）
}

// 展示选项后果 + 继续按钮（htmlFn 返回双语 HTML，语言切换时可重渲染）
function showChoiceResult(htmlFn, onDone){
  G._lastResult = { htmlFn, onDone };
  renderChoiceResult();
}
// 重渲染结果面板（语言切换 / 重新展示时调用）
function renderChoiceResult(){
  if(!G._lastResult) return;
  const panel = document.getElementById('choice-panel');
  panel.classList.add('show'); panel.innerHTML = '';
  const r = document.createElement('div'); r.className='cp-result'; r.innerHTML = G._lastResult.htmlFn();
  panel.appendChild(r);
  const cont = document.createElement('button'); cont.className='cp-submit'; cont.textContent = t('continueBtn');
  cont.onclick = ()=>{ panel.classList.remove('show'); if(G._lastResult.onDone) G._lastResult.onDone(); };
  panel.appendChild(cont);
  G._choice = { cont: ()=>cont.onclick() };
}

// 第6-2 自动结算（netWorth = coins - liability，S/A/B/C/D 评级）
function presentAutoCalc(sub, onDone){
  G.phase='DAY'; renderTopbar();
  const st = G.playerStatus;
  const net = st.coins - st.liability;
  const health = Math.max(0, Math.round((net/3000)*100));
  let grade = 'D';
  if(net>10000 && st.literacy>90) grade='S';
  else if(net>5000 && st.literacy>70) grade='A';
  else if(net>0 && st.literacy>50) grade='B';
  else if(net<0 || st.liability>3000) grade='C';
  else grade='D';
  const c = sub.consequences[grade];
  const html = `<b>${t('gradeTitle')}</b><br>
    ${t('netWorth')}：${money(net)}　${t('literacyScore')}：${st.literacy}　${t('healthLabel')}：${health}%<br>
    <b>${t('gradeLabel')}：${grade}</b><br>${TXT(c.zh, c.en)}`;
  showChoiceResult(()=>html, onDone);
}

/* ---------- 12.4 投票阶段 ---------- */
function enterVote(skipUndo){
  G.phase = 'VOTE'; renderTopbar();
  if(G.playerDead){
    // 玩家已出局：仅 NPC 投票
    logB(B('你已出局，作为旁观者观战', 'You are out — spectating'));
    resolveVotes(null); return;
  }
  // 防御守卫：若场上存活人数 ≤ 1，无候选可投，直接结算（避免空候选软锁死）。
  // v0.6：实际的屠边胜负判定统一在 settle() 内 checkWinCondition() 执行，
  // 此处仅做"进入投票前"的空候选兜底。
  if(aliveSeats().length <= 1){ settle(); return; }
  G.pkTied = null;
  const panel = document.getElementById('vote-panel');
  const hint = document.getElementById('vote-hint');
  document.getElementById('vp-tip').textContent = t('vpTip');
  hint.style.display = 'none';   // 提示已由 vp-tip 呈现，避免重复遮挡
  panel.classList.add('show');
  // 记录当前面板回调（点击与自动化测试共用）
  G._onPick = (targetId)=>{
    panel.classList.remove('show'); hint.style.display = 'none';
    resolveVotes(targetId);
  };
  if(!skipUndo) pushUndo({ type:'vote' });
  renderStage(true, (targetId)=>{ if(G._onPick) G._onPick(targetId); });
}

/* ---------- 12.5 收集并统计票数（玩家 + NPC AI） ---------- */
function resolveVotes(playerTarget){
  // v0.6：移除 G.hunterGunUsed 的局内复位（该复位是 v0.5.3 猎人重复触发的根因）；
  // 猎人开枪标记仅开局置 false，开枪/放弃后置 true 后永不再复位。
  const alive = aliveSeats();
  if(alive.length <= 1){ settle(); return; } // 仅剩 1 人，直接结算判定胜负（避免空候选崩溃）
  const votes = {}; // targetId -> count
  const addVote = (tid)=>{ if(tid!=null) votes[tid] = (votes[tid]||0)+1; };

  // 玩家票：固定 1 票（v1.0 carryover 修复，isGroupVote 不再影响票权）
  if(playerTarget){ addVote(playerTarget); }

  const wolves = alive.filter(s=>s.faction==='wolf');
  const nonWolves = alive.filter(s=>s.faction!=='wolf');

  // 镇民共识：每轮讨论形成一名"可疑对象"（P0 无真实线索，按概率偏向真狼，模拟朴素讨论）
  let townSuspect = null;
  if(nonWolves.length>0){
    if(wolves.length>0 && Math.random() < BAL.townCorrect){
      townSuspect = pick(wolves).char.id;        // 讨论碰巧指向真狼
    } else {
      townSuspect = pick(nonWolves).char.id;      // 讨论误伤好人
    }
  }
  // 好人民主跟随共识（玩家除外，玩家自由判断）；
  // 若存在预言家已确认的狼人，镇民以高概率相信并集中投该狼（模拟"跳预言家"后的舆论一致）
  const knownAlive = G.knownWolves.map(id=>seatById(id)).filter(s=>s && s.alive);
  alive.filter(s=>s.faction!=='wolf' && !s.isPlayer).forEach(s=>{
    const cands = alive.filter(t=>t.char.id!==s.char.id);
    if(knownAlive.length>0 && Math.random() < 0.92){
      addVote(pick(knownAlive).char.id);
    } else if(townSuspect && townSuspect!==s.char.id && Math.random() < BAL.townFollow){
      addVote(townSuspect);
    } else {
      addVote(pick(cands).char.id);
    }
  });
  // 狼人协同：共同投一名非狼（优先神民 / 玩家）
  if(wolves.length>0 && nonWolves.length>0){
    const prefer = nonWolves.filter(s=>s.faction==='god' || s.isPlayer);
    const wt = (prefer.length>0 ? pick(prefer) : pick(nonWolves));
    wolves.forEach(w=> addVote(wt.char.id));
  }

  // 计票：最高票淘汰；平票进入 PK
  let max = 0; Object.values(votes).forEach(v=> max=Math.max(max,v));
  const topIds = Object.keys(votes).filter(k=>votes[k]===max);
  G.voteOutId = null;
  if(topIds.length===1 && max>0){
    G.voteOutId = parseInt(topIds[0],10);
  } else if(topIds.length > 1 && max>0){
    enterPK(topIds.map(Number)); // 平票 → PK 加时投票
    return;
  }

  G.dialogQueue = [];
  if(G.voteOutId){
    announceVoteOut(G.voteOutId);
  } else {
    say(null, B('本轮平票，本轮无人出局。', 'Tie — no one eliminated this round.'));
    logB(B('投票：平票，本轮无人出局', 'Vote: Tie — no one eliminated'), { cls:'h-event', bold:true });
  }
  // 玩家猎人被票出 → 开枪 UI（打断，回调后结算）；否则正常结算
  if(!proceedAfterElimination()) playDialogQueue(()=> settle());
}

// 播报投票出局 + 遗言 + 击杀（含猎人连锁）
function announceVoteOut(id){
  const v = seatById(id);
  const nb = npcNameB(v.char.id);
  const slZh = v.char.id+'号', slEn = ''+v.char.id;
  say(null, B(`投票结束，${slZh} ${nb.zh} 以最高票被投出局！`, `The votes are counted. ${slEn} ${nb.en} is voted out!`));
  logB(B(`投票：${slZh} ${nb.zh} ${tB('eliminated').zh}（最高票）`, `Vote: ${slEn} ${nb.en} ${tB('eliminated').en} (top vote)`), { cls:'h-event', bold:true });
  // 遗言（被投出者发言）—— 取自 A2 台词库 lines.eliminatedVote，缺失则回退通用台词
  const lw = (NPC_BY_ID[id] && NPC_BY_ID[id].lines && NPC_BY_ID[id].lines.eliminatedVote && NPC_BY_ID[id].lines.eliminatedVote[0]);
  say(id, lw || B('我……我真的不是狼人……', "I… I wasn't the wolf…"));
  // 击杀（触发猎人连锁；玩家猎人的开枪 UI 由调用方在结算前处理）
  killSeat(id, 'vote');
  renderStage();
}

/* ---------- 12.5b PK 加时投票（平票时进入） ---------- */
function enterPK(tiedIds, skipUndo){
  G.phase = 'PK'; renderTopbar();
  G.pkTied = tiedIds;
  // 防御：若平票者均已出局 / 不存在，无法进入 PK，直接结算
  const aliveTied = tiedIds.map(id=>seatById(id)).filter(x=>x && x.alive && !x.isPlayer);
  if(aliveTied.length === 0){ settle(); return; }
  G.dialogQueue = [];
  const zhIds = tiedIds.map(i=>i+'号').join('、');
  const enIds = tiedIds.join(', ');
  const playerSeat = G.seats.find(s=>s.isPlayer);
  const playerInPK = !!(playerSeat && playerSeat.alive && tiedIds.includes(playerSeat.char.id));
  // 1) 主持人公告：进入 PK，每人一次发言机会
  say(null, B(`出现平票！${zhIds} 进入 PK，每人有一次发言机会。`, `Tie vote! ${enIds} are tied — each gets one PK statement.`));
  // 2) PK 发言阶段：平票者依次发言（NPC 用台词库 pkSpeech，玩家在 PK 中自动发言）
  tiedIds.forEach(id=>{
    const s = seatById(id);
    if(s && s.alive){
      if(s.isPlayer){
        say(id, B('我请在座的各位再想想——把我投出去，你们就少了一双眼睛，真正的狼人正在偷笑。',
                   "I ask everyone to think again — vote me out and you lose a pair of eyes; the real wolf is laughing."));
      } else {
        const pkLine = (NPC_BY_ID[id] && NPC_BY_ID[id].lines && NPC_BY_ID[id].lines.pkSpeech && NPC_BY_ID[id].lines.pkSpeech[0]);
        say(id, pkLine || B('我？我是好人！投我你们就中了狼人的圈套。', "Me? I'm a good citizen! Voting me plays right into the wolves' hands."));
      }
    }
  });
  playDialogQueue(()=>{
    // 3) 主持人公告：PK 发言结束，请除平票者外的玩家重新投票
    G.dialogQueue = [];
    say(null, B(`PK 发言结束，请除 ${zhIds} 外的玩家重新投票。`, `PK statements done — everyone except ${enIds} re-votes now.`));
    if(G.playerDead || playerInPK){
      // 玩家已出局 或 玩家是 PK 候选人（候选人不投票）→ 仅由其余 NPC 重新投票
      if(G.playerDead) logB(B('你已出局，旁观 PK 重新投票', 'You are out — watching the PK revote'));
      else logB(B('你是 PK 候选人，本环节不投票', 'You are a PK candidate — you abstain this vote'));
      playDialogQueue(()=> resolvePK(tiedIds, null));
    } else {
      // 玩家不是 PK 候选人 → 在候选人中投出一票
      const panel = document.getElementById('vote-panel');
      const hint = document.getElementById('vote-hint');
      document.getElementById('vp-tip').textContent = TXT('PK：在平票者中选择一人投出', 'PK: choose one of the tied to eliminate');
      hint.style.display = 'none';   // 提示已由 vp-tip 呈现，避免重复遮挡
      panel.classList.add('show');
      G._onPick = (targetId)=>{
        panel.classList.remove('show'); hint.style.display = 'none';
        resolvePK(tiedIds, targetId);
      };
      if(!skipUndo) pushUndo({ type:'pk', tiedIds });
      renderStagePK(tiedIds);
    }
  });
}
// PK 仅平票者可选
function renderStagePK(tiedIds){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const playerSeat = G.seats.find(s=>s.isPlayer);
  const playerIsWolf = !!(playerSeat && playerSeat.faction==='wolf');
  const tableSeats = buildTableSeats();
  let seatNum = 0;
  tableSeats.forEach((s, idx)=>{
    if(s.isHost){
      const hostDiv = document.createElement('div');
      hostDiv.className = 'seat host-seat pk-dim';
      hostDiv.setAttribute('data-id', '0');
      hostDiv.setAttribute('data-seat', 'host');
      const p = seatPointByIndex(idx);
      hostDiv.style.left = p[0]; hostDiv.style.top = p[1];
      const hi = document.createElement('img'); hi.className='seat-avatar avatar'; hi.src=asset('characters/portrait_host.png'); imgFallback(hi);
      const hn = document.createElement('div'); hn.className='seat-no'; hn.textContent=(LANG==='en'?'Host':'法官');
      const hm = document.createElement('div'); hm.className='seat-name'; hm.textContent=(LANG==='en'?'Host Sprite':'主持人小精灵');
      hostDiv.appendChild(hi); hostDiv.appendChild(hn); hostDiv.appendChild(hm);
      applySeatVisualMarks(hostDiv, s, playerIsWolf);
      stage.appendChild(hostDiv);
      return;
    }
    seatNum += 1;
    const selectable = s.alive && tiedIds.includes(s.char.id) && !s.isPlayer;
    const div = document.createElement('div');
    div.className = seatDomBaseClass(s, selectable) + (selectable ? ' pk-candidate' : ' pk-dim');
    div.setAttribute('data-id', s.char.id);
    div.setAttribute('data-seat', String(seatNum));
    const pos = seatPointByIndex(idx);
    div.style.left = pos[0];
    div.style.top = pos[1];

    const img = document.createElement('img');
    img.className = 'seat-avatar avatar';
    img.src = asset('characters/'+s.char.portrait);
    imgFallback(img);
    div.appendChild(img);

    const no = document.createElement('div'); no.className='seat-no'; no.textContent = s.char.id + (LANG==='en'?'':'号');
    const nm = document.createElement('div'); nm.className='seat-name'; nm.textContent = npcName(s.char.id);
    const tg = document.createElement('div'); tg.className='seat-tag'; tg.textContent = npcTag(s.char.id);
    div.appendChild(no); div.appendChild(nm); div.appendChild(tg);

    applySeatVisualMarks(div, s, playerIsWolf);

    if(selectable){ div.onclick = ()=>{ if(G._onPick) G._onPick(s.char.id); }; }
    stage.appendChild(div);
  });
}
function resolvePK(tiedIds, playerTarget){
  // v0.6：移除 G.hunterGunUsed 局内复位（理由同 resolveVotes）。
  const alive = aliveSeats();
  const validTied = tiedIds.map(id=>seatById(id)).filter(x=>x && x.alive && !x.isPlayer);
  if(validTied.length === 0){ settle(); return; } // 平票者均已出局，直接结算
  const votes = {};
  const addVote = (tid)=>{ if(tid!=null) votes[tid] = (votes[tid]||0)+1; };
  if(playerTarget && validTied.some(x=>x.char.id===playerTarget)) addVote(playerTarget);
  // NPC 仅在「非平票候选人」的好人/狼中投票；平票候选人本人不参与投票（PK 规则：候选人弃权）。
  alive.filter(s=>!s.isPlayer && !tiedIds.includes(s.char.id)).forEach(s=>{
    const cands = validTied.filter(x=>x.char.id!==s.char.id);
    if(cands.length===0) return;
    if(s.faction==='wolf'){
      const goodC = cands.filter(x=>x.faction!=='wolf');
      addVote((goodC.length ? pick(goodC) : pick(cands)).char.id);
    } else {
      addVote(pick(cands).char.id);
    }
  });
  let max = 0; Object.values(votes).forEach(v=> max=Math.max(max,v));
  const top = Object.keys(votes).filter(k=>votes[k]===max);
  G.voteOutId = null;
  G.dialogQueue = [];
  if(top.length===1 && max>0){
    G.voteOutId = parseInt(top[0],10);
    announceVoteOut(G.voteOutId);
  } else {
    say(null, B('PK 再次平票，本轮无人出局。', 'PK tie again — no one eliminated.'));
    logB(B('PK：'+tB('pkTie').zh, 'PK: '+tB('pkTie').en), { cls:'h-event', bold:true });
  }
  // 玩家猎人被 PK 出 → 开枪 UI（打断，回调后结算）；否则正常结算
  if(!proceedAfterElimination()) playDialogQueue(()=> settle());
}

/* ---------- 12.6 结算阶段：揭示身份 + 财务 + 7 结局判定 ---------- */
function settle(){
  G.phase = 'SETTLE';
  renderTopbar();
  G.dialogQueue = [];

  // 揭示本轮出局 / 遇害者身份
  [G.voteOutId, G.nightKillId].forEach(id=>{
    if(id){
      const v = seatById(id);
      if(v){
        const fZh = v.faction==='wolf' ? tB('revealWolf').zh : v.faction==='god' ? tB('revealGod').zh : tB('revealVillager').zh;
        const fEn = v.faction==='wolf' ? tB('revealWolf').en : v.faction==='god' ? tB('revealGod').en : tB('revealVillager').en;
        const nb = npcNameB(v.char.id);
        const slZh = v.char.id+'号', slEn = ''+v.char.id;
        say(null, B(`${slZh} ${nb.zh} 的身份是：${fZh}。`, `${slEn} ${nb.en} was a ${fEn}.`));
      }
    }
  });

  // 财务：每轮生活费 -¥500（统一走 changeStatus）；v0.8 P0-1：玩家已出局 → 8 键状态栏冻结，不再扣生活费
  if(!G.playerDead){
    changeStatus('coins', -500, 'living');
    logB(B('生活费：-'+money(500)+'（剩 '+money(G.playerStatus.coins)+'，负债 '+money(G.playerStatus.liability)+'）',
            'Living cost: -'+money(500)+' (Left '+money(G.playerStatus.coins)+', Debt '+money(G.playerStatus.liability)+')'), { cls:'h-event', bold:true });
  }

  playDialogQueue(()=>{
    // 破产优先判定（提前结束）：coins<0 且 liability>5000
    if(G.playerStatus.coins < BANKRUPT.coinsBelow && G.playerStatus.liability > BANKRUPT.liabilityAbove){
      G.goodWon = false; endGame('bankrupt'); return;
    }
    // v0.6：每轮白天投票结算后立即执行胜负判定（屠边规则），不再拖延到 6 轮。
    const win = checkWinCondition();
    if(win === 'GOOD'){ G.goodWon = true; evaluateFinalEnding(true); return; }   // 狼人全灭 → 好人胜
    if(win === 'WOLF'){ G.goodWon = false; evaluateFinalEnding(false); return; }  // 神/民被屠边 → 狼人胜
    if(win === 'END'){ // 场上≤1人：按存活者阵营判定胜负
      const last = aliveSeats()[0];
      const good = !last || last.faction !== 'wolf';
      G.goodWon = good; evaluateFinalEnding(good); return;
    }
    // 未分胜负：进入下一轮（封顶 6 轮，避免无限循环）
    if(G.round >= G.maxRound){
      // 6 轮耗尽仍无屠边：以「狼人未全灭」为默认（玩家个人结局由财务/标记决定）
      G.goodWon = false; evaluateFinalEnding(false); return;
    }
    G.round += 1;
    renderTopbar();
    beginRound();
  });
}

// v0.6：7 结局判定（按 endingsData 的 8 键 + 隐藏 liability + 标记键 + 胜负 + 玩家存活）。
// 设计原则（对照 endings_data.js 的 condition 字段语义）：
//   1) 破产已在 settle() 提前判定（coins<0 && liability>5000），此处只处理其余 7 结局。
//   2) collude（接受利诱/封口费）→ 被狼同化（失败，最高优先）。
//   3) dominoRisk 且连锁成立 → 多米诺崩塌（失败）。
//   4) 玩家出局 → 个人故事线以失败收场，绝不映射「孤独幸存者」（孤独幸存者须玩家存活），给失败结局。
//   5) 玩家存活 + 好人胜(goodWon) → 三个胜利结局之一（按财务/道德表现细分，兜底知识守护者）。
//   6) 玩家存活 + 狼人胜(屠边) → 孤独幸存者（明哲保身：social<40 且 非正义）或失败兜底（被狼同化）。
//   保证 7 结局 + 破产全部可达（自测 verifyEndingsReachable 强制各状态验证）。
function evaluateFinalEnding(goodWon){
  const st = G.playerStatus;
  const net = st.coins - st.liability;
  const f = G.flags;
  let endingId;
  // 1) 利诱/封口 → 被狼同化
  if(f.collude) endingId = 'assimilated';
  // 2) 多米诺担保连锁 → 崩塌
  else if(f.dominoRisk && G.dominoChainActive) endingId = 'domino_collapse';
  // 3) 玩家已出局：个人结局为失败（绝不给孤独幸存者），兜底被狼同化
  else if(G.playerDead) endingId = 'assimilated';
  // 4) 玩家存活 + 好人阵营胜利 → 胜利结局
  else if(goodWon){
    if(G.reportCount>=2 && st.literacy>80 && st.social>=6) endingId = 'community_hero';
    else if(net>10000 && st.liability===0) endingId = 'financial_freedom';
    else if(st.literacy>80 && f.exposed) endingId = 'knowledge_guardian';
    else endingId = 'knowledge_guardian';   // 胜利兜底：守住了本心与好人阵营
  }
  // 5) 玩家存活 + 狼人阵营胜利（屠边）→ 孤独幸存者（明哲保身）或失败兜底
  else {
    if(st.social<40 && !f.justice) endingId = 'lone_survivor';
    else endingId = 'assimilated';
  }
  endGame(endingId);
}

/* ---------- 12.7 游戏结束（7 结局） ---------- */
function endGame(endingId){
  updateCtrlLabels(); // 确保「再来一局」等按钮按当前语言显示
  const panel = document.getElementById('end-panel');
  const title = document.getElementById('end-title');
  const detail = document.getElementById('end-detail');
  G.result = endingId; // 结局 id，供测试/统计读取
  const ed = (typeof endingsData !== 'undefined') ? endingsData[endingId] : null;
  panel.classList.remove('hidden');
  if(ed){
    title.textContent = TXT(ed.title.zh, ed.title.en);
    const ach = ed.unlocked_achievement ? TXT(ed.unlocked_achievement.zh, ed.unlocked_achievement.en) : '';
    const rq  = ed.reflection_question ? TXT(ed.reflection_question.zh, ed.reflection_question.en) : '';
    // v0.6：胜负横幅（破产结局不显示阵营胜负，其叙事自带结局含义）
    let banner = '';
    if(endingId !== 'bankrupt'){
      const won = !!G.goodWon;
      const label = won ? t('winGood') : t('winWolf');
      const desc  = won ? t('goodWinDesc') : t('wolfWinDesc');
      banner = `<p class="end-banner ${won?'win':'lose'}"><b>${label}</b>　${desc}</p>`;
    }
    // 逐行小头像花名册（P1-1）
    const roster = G.seats.map(s=>{
      const fct = s.faction==='wolf'?t('revealWolf'):s.faction==='god'?t('revealGod'):t('revealVillager');
      const status = s.alive ? ('<span class="r-alive">'+TXT('存活','Alive')+'</span>') : ('<span class="r-out">'+TXT('出局','Out')+'</span>');
      return `<div class="r-line${s.alive?'':' dead'}${s.isPlayer?' player-row':''}">`+
             `<img class="r-avatar" src="${asset('characters/'+s.char.portrait)}" alt="">`+
             `<span class="r-name">${seatLabel(s.char.id)} ${npcName(s.char.id)}</span>`+
             `<span style="color:#5a3a1a">${fct}</span>`+ status + `</div>`;
    }).join('');
    detail.innerHTML =
      banner +
      `<p>${TXT(ed.narrative.zh, ed.narrative.en)}</p>` +
      `<p><span class="end-ach"><span class="ach-ico">🏅</span>${ach}</span></p>` +
      `<p style="color:#8a2b00"><b>${t('reflectionLabel')}：</b>${rq}</p>` +
      `<div class="end-roster">${roster}</div>`;
  } else {
    title.textContent = TXT('游戏结束','Game Over');
    detail.innerHTML = `<p>${TXT('本局结束。','This round is over.')}</p>`;
  }
  setScene('DAY');
}

/* ---------- 13. 双语切换（P2 将扩展正文台词） ---------- */
function toggleLang(){
  LANG = (LANG==='en') ? 'zh' : 'en';
  document.documentElement.lang = (LANG==='en') ? 'en' : 'zh-CN';   // v0.8.1：驱动 :lang(en) 仅英文微调字号
  if(!G){ renderStartLang(); return; }
  updateCtrlLabels();
  updateNextLabel();
  renderTopbar();
  renderStatusbar();
  // P0-2：历史记录面板按当前语言整面板重渲染，杜绝中英混合
  renderHistory();
  // 开局身份面板进行中：按当前语言重填（角色不变，仅文案切换）
  if(!document.getElementById('identity-panel').classList.contains('hidden')) showIdentityPanel();
  // 当前对话框（若正在播放）即时重渲染
  if(G._curDialogItem) renderDialogItem(G._curDialogItem, true);
  // 投票面板进行中
  const voting = document.getElementById('vote-panel').classList.contains('show');
  renderStage(voting, voting ? G._onPick : null);
  // 选择题面板 / 夜间行动面板进行中：按当前语言重建（双语即时切换）
  const cp = document.getElementById('choice-panel');
  if(cp.classList.contains('show')){
    if(G._nightRebuild){ G._nightRebuild(); }                 // 夜间行动 UI（狼/预言家/女巫/猎人）
    else if(G._lastResult) renderChoiceResult();
    else if(G._lastChoiceCall) presentChoice(G._lastChoiceCall.choices, G._lastChoiceCall.opts, true);
  }
  // 知识点卡片进行中：重渲染
  const kp = document.getElementById('knowledge-panel');
  if(kp.classList.contains('show') && G._knowledgeKey){ showKnowledgeCard(G._knowledgeKey); }
  // 结局面板进行中：按当前语言重建（P2-6：语言切换覆盖结局界面）
  if(!document.getElementById('end-panel').classList.contains('hidden') && G.result){
    endGame(G.result);
  }
}

  if(LANG==='en'){
